# Builds the module for Foundry whenever a Release is published on GitHub.
#
# What happens, step by step:
# 1. GitHub starts a fresh virtual computer and copies the repo onto it.
# 2. The release's tag (e.g. "v1.0.1") becomes the version ("1.0.1").
# 3. module.json gets that version, and a download link pointing at this
#    release's zip.
# 4. The module's files are zipped into module.zip.
# 5. module.json and module.zip are attached to the release.
#
# Foundry's manifest link always points at the LATEST release's module.json,
# so publishing a new release is all it takes for users to get an update.

name: Release

on:
  release:
    types: [published]

# Allows this workflow to attach files to the release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo's files
        uses: actions/checkout@v4

      - name: Work out the version from the tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set the version and download link in module.json
        run: |
          jq --arg version "${{ steps.version.outputs.version }}" \
             --arg download "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/module.zip" \
             '.version = $version | .download = $download' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Zip the module
        run: zip -r module.zip module.json LICENSE README.md lang scripts styles templates

      - name: Attach module.json and module.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" module.json module.zip --clobber
